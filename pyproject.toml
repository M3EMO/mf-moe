[project]
name = "mf-moe"
version = "0.1.0"
description = "Experimento MoE fractal: ¿división, repetición y fusión de expertos reducen el olvido?"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.4", "transformers>=5.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mf_moe*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
